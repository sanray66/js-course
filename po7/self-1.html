<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Самостоятельное 1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .header { display: flex; justify-content: space-between; padding: 16px 32px; background: #2e2b33; color: #fff; }
        .hero { padding: 32px; background: #eef1f5; }
        .hero div { margin-top: 12px; }
        .projects { display: flex; gap: 12px; padding: 24px 32px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; width: 200px; }
        .accent { color: #e53935; }
    </style>
</head>
<body>
    <header class="header">
        <b>Studio</b>
        <nav>Work · About · Contacts</nav>
    </header>
    <section class="hero">
        <h1>Мы делаем сайты</h1>
        <div><button id="work">Work With Us</button></div>
    </section>
    <section class="projects">
        <article class="card"><h3>Проект 1</h3><p>Лендинг</p></article>
        <article class="card"><h3>Проект 2</h3><p>Интернет-магазин</p></article>
        <article class="card"><h3>Проект 3</h3><p>Блог</p></article>
        <article class="card"><h3>Проект 4</h3><p>Портфолио</p></article>
    </section>
    <script src="self-1.js"></script>
</body>
</html>
